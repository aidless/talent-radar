name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python syntax check
        run: python3 -m py_compile serve.py research/analyze.py

      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: JavaScript tests
        run: node tests/test_datapool_js.js
